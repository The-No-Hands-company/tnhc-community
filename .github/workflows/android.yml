name: Android apps
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify both app variants
        run: ./gradlew :app:verifyBothDebugApps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tnhc-community-android-${{ github.sha }}
          path: |
            app/build/outputs/apk/member/debug/app-member-debug.apk
            app/build/outputs/apk/founder/debug/app-founder-debug.apk
            app/build/reports/
          if-no-files-found: warn
